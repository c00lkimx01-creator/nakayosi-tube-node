<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Google</title>
<link rel="icon" href="https://www.google.com/favicon.ico">
<style>body{font-family:arial,sans-serif;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
img{width:272px;margin-bottom:24px}
form{display:flex;flex-direction:column;align-items:center;width:100%;max-width:584px}
input{width:90%;padding:12px 20px;border:1px solid #dfe1e5;border-radius:24px;font-size:16px;outline:none}
input:focus,input:hover{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.btns{margin-top:18px;display:flex;gap:12px}
button{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;padding:0 16px;height:36px;cursor:pointer}
button:hover{box-shadow:0 1px 1px rgba(0,0,0,.1);border-color:#dadce0}</style></head>
<body><img alt="Google" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">
<form action="https://www.google.com/search"><input name="q" autofocus>
<div class="btns"><button type="submit">Google 検索</button><button type="button">I'm Feeling Lucky</button></div></form></body></html>
